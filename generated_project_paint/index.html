<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernPaint</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Toolbar with tool buttons and controls -->
    <div id="toolbar">
        <button data-tool="freehand" title="Freehand">Freehand</button>
        <button data-tool="line" title="Line">Line</button>
        <button data-tool="rectangle" title="Rectangle">Rectangle</button>
        <button data-tool="ellipse" title="Ellipse">Ellipse</button>
        <button data-tool="eraser" title="Eraser">Eraser</button>
        <button data-tool="clear" title="Clear Canvas">Clear</button>
        <button data-tool="undo" title="Undo">Undo</button>
        <button data-tool="redo" title="Redo">Redo</button>
        <button data-tool="save" title="Save Image">Save</button>
        <label for="brushSize">Brush Size:</label>
        <input type="range" id="brushSize" min="1" max="50" value="5">
        <label for="strokeColor">Stroke:</label>
        <input type="color" id="strokeColor" value="#000000">
        <label for="fillColor">Fill:</label>
        <input type="color" id="fillColor" value="#ffffff">
    </div>

    <!-- Canvas container -->
    <div id="canvasContainer">
        <canvas id="paintCanvas"></canvas>
    </div>
</body>
</html>
