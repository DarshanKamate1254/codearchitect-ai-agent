<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest &amp; EMI Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <main class="calculator-container">
        <!-- Simple Interest Calculator -->
        <section id="simple-interest-section">
            <h2>Simple Interest Calculator</h2>
            <form id="si-form" novalidate>
                <div class="form-group">
                    <label for="si-principal">Principal Amount</label>
                    <input id="si-principal" type="number" min="0" step="any" aria-label="Principal amount" required>
                </div>
                <div class="form-group">
                    <label for="si-rate">Rate of Interest (%)</label>
                    <input id="si-rate" type="number" min="0" step="any" aria-label="Rate of interest (%)" required>
                </div>
                <div class="form-group">
                    <label for="si-time">Time Period (years)</label>
                    <input id="si-time" type="number" min="0" step="any" aria-label="Time period (years)" required>
                </div>
                <div id="si-error" class="error-message" aria-live="polite"></div>
                <p id="si-result" class="result"></p>
                <button id="si-reset" type="button">Reset</button>
            </form>
        </section>

        <!-- EMI Calculator -->
        <section id="emi-section">
            <h2>EMI Calculator</h2>
            <form id="emi-form" novalidate>
                <div class="form-group">
                    <label for="emi-principal">Loan Amount</label>
                    <input id="emi-principal" type="number" min="0" step="any" aria-label="Loan amount" required>
                </div>
                <div class="form-group">
                    <label for="emi-rate">Annual Interest Rate (%)</label>
                    <input id="emi-rate" type="number" min="0" step="any" aria-label="Annual interest rate (%)" required>
                </div>
                <div class="form-group">
                    <label for="emi-tenure">Loan Tenure (months)</label>
                    <input id="emi-tenure" type="number" min="0" step="any" aria-label="Loan tenure (months)" required>
                </div>
                <div id="emi-error" class="error-message" aria-live="polite"></div>
                <p id="emi-result" class="result"></p>
                <button id="emi-reset" type="button">Reset</button>
            </form>
        </section>
    </main>
    <footer>
        <p>© 2024 Simple Interest &amp; EMI Calculator. Developed by OpenAI Codex.</p>
    </footer>
</body>
</html>
